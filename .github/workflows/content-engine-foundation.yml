name: Content Engine Foundation

on:
  pull_request:
    paths:
      - "src/lib/content-engine/**"
      - "src/components/content-engine/**"
      - "src/app/for/sushi/**"
      - "scripts/check-content-engine-foundation.ts"
      - "docs/content-engine/**"
      - ".github/workflows/content-engine-foundation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Reconcile existing lockfile metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Generate route types
        run: npx next typegen
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint foundation
        run: npx eslint src/lib/content-engine src/components/content-engine src/app/for/sushi scripts/check-content-engine-foundation.ts
      - name: Industry and Brand Profile unit checks
        run: npx tsx scripts/check-content-engine-foundation.ts
      - name: Production build
        run: npm run build
