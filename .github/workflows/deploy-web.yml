name: Deploy Web to Cloud Run

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "preview/**"
      - "**/*.md"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: supply-491510
      REGISTRY_REGION: europe-west3
      REGION: europe-west1
      SERVICE_NAME: postory
      IMAGE: europe-west3-docker.pkg.dev/supply-491510/postory/web:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGISTRY_REGION }}-docker.pkg.dev --quiet

      - name: Build
        run: docker build -t ${{ env.IMAGE }} .

      - run: docker push ${{ env.IMAGE }}

      - name: Deploy
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --min-instances=0 --max-instances=3 \
            --memory=1Gi --cpu=1 \
            --timeout=300 \
            --set-env-vars="APP_URL=https://postory-dfd7b2qpra-ew.a.run.app,STORAGE=gcs,GCS_BUCKET=postory-user-media,AI_PROVIDER=fake,STRIPE_MODE=fake,AYRSHARE_MODE=real" \
            --set-secrets="DATABASE_URL=postory-database-url:latest,AUTH_SECRET=postory-auth-secret:latest,ENCRYPTION_KEY=postory-encryption-key:latest,AYRSHARE_API_KEY=postory-ayrshare-api-key:latest" \
            --quiet

      - name: Verify
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          echo "✅ $URL"
          curl -sf -o /dev/null -w "login HTTP %{http_code}\n" "$URL/login"
          curl -sf -o /dev/null -w "landing HTTP %{http_code}\n" "$URL/"
          curl -sf -o /dev/null -w "legal HTTP %{http_code}\n" "$URL/legal/terms"
          curl -sf -o /dev/null -w "asset HTTP %{http_code}\n" "$URL/assets/templates/orshot/orshot-2444-1.png"
