name: Deploy Web to Cloud Run

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "preview/**"
      - "**/*.md"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: supply-491510
      REGISTRY_REGION: europe-west3
      REGION: europe-west1
      SERVICE_NAME: postory
      IMAGE: europe-west3-docker.pkg.dev/supply-491510/postory/web:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGISTRY_REGION }}-docker.pkg.dev --quiet

      - name: Validate public Turnstile site key
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: test -n "$NEXT_PUBLIC_TURNSTILE_SITE_KEY"

      - name: Build images
        run: |
          docker build --target migrations -t ${{ env.IMAGE }}-migrations .
          docker build --build-arg NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }} -t ${{ env.IMAGE }} .
          docker push ${{ env.IMAGE }}-migrations
          docker push ${{ env.IMAGE }}

      - name: Apply database migrations
        run: |
          gcloud run jobs deploy postory-migrations \
            --image ${{ env.IMAGE }}-migrations \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --service-account=549968261036-compute@developer.gserviceaccount.com \
            --set-secrets="DATABASE_URL=postory-database-url:latest" \
            --max-retries=0 --task-timeout=300 \
            --quiet
          gcloud run jobs execute postory-migrations \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --wait

      - name: Deploy
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --min-instances=0 --max-instances=3 \
            --memory=1Gi --cpu=1 \
            --timeout=300 \
            --set-env-vars="APP_URL=https://postory-dfd7b2qpra-ew.a.run.app,STORAGE=gcs,GCS_BUCKET=postory-user-media,AI_PROVIDER=fake,STRIPE_MODE=fake,AYRSHARE_MODE=real,DEMO_DAILY_GENERATION_LIMIT=10,DEMO_TRUSTED_IP_HEADER=x-forwarded-for" \
            --set-secrets="DATABASE_URL=postory-database-url:latest,AUTH_SECRET=postory-auth-secret:latest,ENCRYPTION_KEY=postory-encryption-key:latest,AYRSHARE_API_KEY=postory-ayrshare-api-key:latest,OPENAI_API_KEY=postory-openai-api-key:latest,TURNSTILE_SECRET_KEY=postory-turnstile-secret:latest,DEMO_TRIAL_HASH_SECRET=postory-demo-trial-hash-secret:latest" \
            --quiet

      - name: Verify
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          echo "✅ $URL"
          curl -sf -o /dev/null -w "login HTTP %{http_code}\n" "$URL/login"
          curl -sf -o /dev/null -w "landing HTTP %{http_code}\n" "$URL/"
          curl -sf -o /dev/null -w "legal HTTP %{http_code}\n" "$URL/legal/terms"
          curl -sf -o /dev/null -w "asset HTTP %{http_code}\n" "$URL/assets/templates/orshot/orshot-2444-1.png"
