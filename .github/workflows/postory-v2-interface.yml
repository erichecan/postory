name: PoStory V2 Interface Validation

on:
  pull_request:
    paths:
      - "src/components/visual/**"
      - "src/lib/publishing/**"
      - "src/lib/actions/designs.ts"
      - "src/lib/actions/restaurant-campaigns.ts"
      - "src/lib/db/approval.ts"
      - "src/lib/db/restaurant-campaigns.ts"
      - "src/components/editor/publish-dialog.tsx"
      - "prisma/**"
      - "Dockerfile"
      - "scripts/verify-publishing-safety.ts"

      - "src/app/api/sakura-creative/**"
      - "src/app/api/marketing-calendar/**"
      - "scripts/verify-sakura-creative.ts"
      - "package*.json"
      - "tsconfig.json"
      - ".github/workflows/postory-v2-interface.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Repair dependency metadata for verification
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Next.js route types
        run: npx next typegen
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint of changed components
        run: npx eslint src/components/visual/marketing-goal-picker.tsx src/components/visual/sushi-campaign-poster.tsx src/components/visual/store-marketing-experience.tsx
      - name: Verify original five-step marketing framework
        run: npx tsx scripts/verify-store-framework.ts
      - name: Render seven Sakura campaign images
        run: npx tsx scripts/verify-sakura-creative.ts
      - name: Verify publication safety guards
        run: npx tsx scripts/verify-publishing-safety.ts
      - name: Production build
        run: npm run build
