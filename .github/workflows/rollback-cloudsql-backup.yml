name: Pre-rollback PostgreSQL backup (4549688)

on:
  push:
    branches: ["ops/backup-before-rollback-4549688"]
    paths: [".github/workflows/rollback-cloudsql-backup.yml"]

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT_ID: supply-491510
      BACKUP_BUCKET: postory-user-media
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Prepare dedicated non-public backup bucket
        shell: bash
        run: |
          set -euo pipefail
          # Existing app media bucket is allowed only if its access configuration is strictly private.
          # Never mutate bucket IAM or weaken any existing security setting.
          gcloud storage buckets describe "gs://$BACKUP_BUCKET" --format=json > /tmp/backup-bucket.json
          jq -e '(.iamConfiguration.publicAccessPrevention == "enforced") and (.iamConfiguration.uniformBucketLevelAccess.enabled == true)' /tmp/backup-bucket.json >/dev/null || {
            echo "Backup bucket does not enforce private access. Refusing backup upload." >&2
            exit 1
          }
      - name: Install PostgreSQL backup utilities
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Dump PostgreSQL and verify private cloud copy
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export PGCONNECT_TIMEOUT=20
          DB_URL="$(gcloud secrets versions access latest --secret=postory-database-url --project="$PROJECT_ID")"
          if [ -z "$DB_URL" ]; then
            echo "Production DATABASE_URL secret is empty. Refusing to proceed." >&2
            exit 1
          fi
          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$WORKDIR"' EXIT
          FILE="$WORKDIR/postory-db-pre-4549688.dump"
          # No passwords printed: the secret URL is only kept in a shell variable.
          pg_dump --dbname="$DB_URL" --format=custom --no-owner --no-privileges --file="$FILE"
          unset DB_URL
          test -s "$FILE"
          pg_restore --list "$FILE" >/dev/null
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          DEST="gs://$BACKUP_BUCKET/rollback-4549688/postory-production-$TS.dump"
          gcloud storage cp "$FILE" "$DEST" --quiet
          gcloud storage cp "$DEST" "$WORKDIR/verified.dump" --quiet
          cmp "$FILE" "$WORKDIR/verified.dump"
          pg_restore --list "$WORKDIR/verified.dump" >/dev/null
          echo "PRIVATE_BACKUP_VERIFIED=$DEST"
          echo "BACKUP_BYTES=$(wc -c < "$FILE")"
          echo "BACKUP_SHA256=$(sha256sum "$FILE" | cut -d' ' -f1)"
